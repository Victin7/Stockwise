<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StockWise: gestão inteligente de estoque para pequenas e médias empresas." />
    <meta name="theme-color" content="#0f2a2d" />
    <title>StockWise | Gestão de estoque</title>
    <script>
      // Evita flash de tema incorreto antes do React montar
      try {
        var raw = localStorage.getItem('stockwise:v1')
        var theme = raw ? JSON.parse(raw).settings.theme : 'system'
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
